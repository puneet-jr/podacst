name: lenny-phase2
services:
  db:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lenny}
      POSTGRES_USER: ${POSTGRES_USER:-lenny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/bootstrap.py first}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    shm_size: 128m
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-lenny}
      POSTGRES_USER: ${POSTGRES_USER:-lenny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/bootstrap.py first}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      GENERATION_MODEL: ${GENERATION_MODEL:-qwen3:0.6b}
      ESSAY_MODEL: ${ESSAY_MODEL:-qwen3:1.7b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:latest}
      PRIVATE_RPC_TRACES: ${PRIVATE_RPC_TRACES:-false}
      CLOUD_MODEL: ${CLOUD_MODEL:-claude-haiku-4-5-20251001}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-ollama}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash-lite}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.cache/corpus:/corpus:ro
      - chat_traces:/app/evidence/private-chat
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
    init: true
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:80"
    depends_on:
      - api
    mem_limit: 64m
volumes:
  pgdata:
  chat_traces:
